<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Комната лобби</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="shell">
    <aside class="sidebar">
        <div class="brand">Quiz</div>
        <a class="nav-link" href="/quizzes">Викторины</a>
        <a class="nav-link active" href="/lobby">Лобби</a>
        <a class="nav-link" href="/leaderboard">Лидерборд</a>
    </aside>
    <main class="content">
        <div class="topbar">
            <div>
                <h1 id="lobby-name">Лобби</h1>
                <p id="lobby-status" class="muted"></p>
            </div>
            <div class="actions">
                <span class="badge" data-current-user></span>
                <a class="button secondary" href="/profile">Кабинет</a>
                <button class="secondary" onclick="logout()">Выйти</button>
            </div>
        </div>

        <section class="panel">
            <h2>Настройки игры</h2>
            <label for="quiz-dropdown">Викторина</label>
            <select id="quiz-dropdown"></select>
            <div class="actions" id="host-actions">
                <button id="save-lobby-btn" class="secondary">Сменить викторину</button>
                <button id="start-quiz-btn">Начать квиз</button>
            </div>
            <p id="room-message" class="muted"></p>
        </section>

        <section class="panel" style="margin-top:16px;">
            <h2>Игроки</h2>
            <div id="players"></div>
        </section>
    </main>
</div>

<script src="/js/auth.js"></script>
<script src="/js/ws-service.js"></script>
<script src="/js/lobby-room.js"></script>
</body>
</html>
