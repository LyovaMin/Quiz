<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактор Квиза</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
<div class="max-w-3xl mx-auto bg-white p-8 rounded-xl shadow-sm border">
    <div class="flex justify-between mb-6">
        <h1 id="form-title" class="text-2xl font-bold">Новый квиз</h1>
        <a href="index.html" class="text-gray-500 hover:underline pt-2">Назад</a>
    </div>

    <form id="quiz-form" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700">Название</label>
            <input type="text" id="title" class="w-full border p-2 rounded mt-1" required>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">Описание</label>
            <textarea id="description" class="w-full border p-2 rounded mt-1"></textarea>
        </div>

        <div class="mb-3">
            <label for="creatorId" class="form-label">ID создателя (пользователя)</label>
            <input type="number" class="form-control" id="creatorId" placeholder="Введите ваш ID">
        </div>

        <div id="questions-container" class="space-y-6 pt-4">
            <h3 class="font-bold text-lg border-b pb-2">Список вопросов</h3>
        </div>

        <button type="button" id="add-q-btn" class="w-full border-2 border-dashed border-gray-300 py-4 text-gray-500 rounded-lg hover:bg-gray-50 transition">
            + Добавить вопрос
        </button>

        <div class="flex justify-between items-center pt-8 border-t">
            <button type="button" id="delete-btn" class="hidden bg-red-50 text-red-600 px-4 py-2 rounded hover:bg-red-100 transition">Удалить квиз</button>
            <button type="submit" class="bg-blue-600 text-white px-10 py-2 rounded hover:bg-blue-700 transition shadow-md">Сохранить всё</button>
        </div>
    </form>
</div>
<script src="/js/edit.js"></script>
</body>
</html>
