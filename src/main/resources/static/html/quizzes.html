<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Викторины</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="shell">
    <aside class="sidebar">
        <div class="brand">Quiz</div>
        <a class="nav-link active" href="/quizzes">Викторины</a>
        <a class="nav-link" href="/lobby">Лобби</a>
    </aside>
    <main class="content">
        <div class="topbar">
            <div>
                <h1>Викторины</h1>
                <p class="muted">Просмотр вопросов, ответов и редактирование своих квизов.</p>
            </div>
            <div class="actions">
                <span class="badge" data-current-user></span>
                <a class="button" href="/quizzes/edit">Создать</a>
                <button class="secondary" onclick="logout()">Выйти</button>
            </div>
        </div>
        <div id="quiz-list" class="grid"></div>
    </main>
</div>

<div id="modal" class="modal">
    <div class="modal-card">
        <div id="modal-content"></div>
        <div class="actions">
            <button class="secondary" onclick="closeModal()">Закрыть</button>
        </div>
    </div>
</div>

<script src="/js/auth.js"></script>
<script src="/js/quizzes.js"></script>
</body>
</html>
