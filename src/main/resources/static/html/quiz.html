<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прохождение квиза</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="content quiz-play">
    <div id="score-corner" class="score-corner">0 очков</div>
    <div class="topbar">
        <div>
            <h1 id="quiz-title">Квиз</h1>
            <p id="quiz-progress" class="muted"></p>
            <div id="timer" class="muted" style="margin-left:12px;"></div>
        </div>
        <div class="actions">
            <button id="end-lobby-quiz-btn" class="danger" style="display:none;">Завершить для всех</button>
            <a class="button secondary" href="/lobby">Лобби</a>
        </div>
    </div>
    <section id="question-container" class="panel">
        <h2 id="question-text"></h2>
        <div id="bonus-panel" class="bonus-panel"></div>
        <div id="answer-options"></div>
    </section>
    <section id="live-scoreboard" class="panel live-scoreboard"></section>
    <section id="quiz-result" class="panel" style="display:none;">
        <h2>Результаты</h2>
        <p>Правильных ответов: <strong id="correct-answers"></strong> из <strong id="total-questions"></strong>.</p>
        <p id="score-line"></p>
        <div id="lobby-results"></div>
        <div style="margin-top:12px;">
            <button id="finish-for-all-btn" class="danger" style="display:none;">Завершить для всех</button>
            <a class="button" href="/quizzes">К списку викторин</a>
        </div>
    </section>
</main>

<script src="/js/auth.js"></script>
<script src="/js/ws-service.js"></script>
<script src="/js/quiz.js"></script>
</body>
</html>
