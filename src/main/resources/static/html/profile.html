<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="shell">
    <aside class="sidebar">
        <div class="brand">Quiz</div>
        <a class="nav-link" href="/quizzes">Викторины</a>
        <a class="nav-link" href="/polls">Опросы</a>
        <a class="nav-link" href="/lobby">Лобби</a>
        <a class="nav-link" href="/leaderboard">Лидерборд</a>
    </aside>
    <main class="content">
        <div class="topbar">
            <div>
                <h1>Личный кабинет</h1>
                <p class="muted">Профиль и личная статистика по ответам.</p>
            </div>
            <div class="actions">
                <span class="badge" data-current-user></span>
                <button class="secondary" onclick="logout()">Выйти</button>
            </div>
        </div>

        <section class="profile-layout">
            <article class="panel profile-panel">
                <div class="profile-head">
                    <img id="profile-avatar" class="avatar" src="" alt="">
                    <div>
                        <h2 id="profile-login" class="card-title">Профиль</h2>
                        <p class="muted">Личная статистика</p>
                    </div>
                </div>
                <div class="actions">
                    <button id="edit-profile-btn" type="button" class="secondary">Редактировать</button>
                </div>
                <div class="filters">
                    <select id="profile-period">
                        <option value="all">Все время</option>
                        <option value="week">Неделя</option>
                        <option value="day">День</option>
                    </select>
                    <select id="profile-topic"></select>
                </div>
                <div id="profile-stats" class="stats-grid"></div>
                <div id="profile-topic-stats" class="topic-stats"></div>
            </article>

            <form id="profile-form" class="panel" style="display:none;">
                <h2 class="card-title">Редактирование</h2>
                <label for="profile-avatar-file">Аватар</label>
                <input id="profile-avatar-file" type="file" accept="image/*">

                <label for="profile-username">Логин</label>
                <input id="profile-username" type="text" maxlength="20" required>

                <label for="profile-password">Новый пароль</label>
                <input id="profile-password" type="password" autocomplete="new-password" placeholder="Оставьте пустым, чтобы не менять">

                <div class="actions">
                    <button type="submit">Сохранить</button>
                    <button id="cancel-profile-edit" type="button" class="secondary">Отмена</button>
                </div>
                <p id="profile-message" class="muted"></p>
            </form>
        </section>

        <section id="admin-users-panel" class="panel" style="display:none; margin-top:16px;">
            <h2 class="card-title">Пользователи</h2>
            <div class="filters">
                <select id="admin-user-select"></select>
            </div>
            <form id="admin-user-form">
                <label for="admin-avatar-file">Аватар</label>
                <input id="admin-avatar-file" type="file" accept="image/*">

                <label for="admin-username">Логин</label>
                <input id="admin-username" type="text" maxlength="20" required>

                <label for="admin-password">Новый пароль</label>
                <input id="admin-password" type="password" autocomplete="new-password" placeholder="Оставьте пустым, чтобы не менять">

                <div class="actions">
                    <button type="submit">Сохранить пользователя</button>
                </div>
                <p id="admin-user-message" class="muted"></p>
            </form>
        </section>
    </main>
</div>

<script src="/js/auth.js"></script>
<script src="/js/profile.js"></script>
</body>
</html>
